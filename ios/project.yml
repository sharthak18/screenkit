name: ScreenKit
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    SCREENKIT_APP_GROUP: group.com.screenkit.ios
    SCREENKIT_KEYCHAIN_GROUP: "$(AppIdentifierPrefix)com.screenkit.ios.shared"
    SCREENKIT_BROADCAST_ID: com.screenkit.ios.broadcast
packages:
  HaishinKit:
    url: https://github.com/HaishinKit/HaishinKit.swift.git
    exactVersion: 2.1.0
  Logboard:
    url: https://github.com/shogo4405/Logboard.git
    exactVersion: 2.5.0
targets:
  ScreenKit:
    type: application
    platform: iOS
    sources:
      - ScreenKit
      - Shared
      - ScreenKitCore/Sources/ScreenKitCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screenkit.ios
        INFOPLIST_FILE: ScreenKit/Info.plist
        CODE_SIGN_ENTITLEMENTS: ScreenKit/ScreenKit.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ScreenKitBroadcast
        embed: true
  ScreenKitBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - BroadcastUpload
      - Shared
      - ScreenKitCore/Sources/ScreenKitCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(SCREENKIT_BROADCAST_ID)"
        INFOPLIST_FILE: BroadcastUpload/Info.plist
        CODE_SIGN_ENTITLEMENTS: BroadcastUpload/BroadcastUpload.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: RTMPHaishinKit
      - package: Logboard
        product: Logboard
schemes:
  ScreenKit:
    build:
      targets:
        ScreenKit: all
        ScreenKitBroadcast: all
    run:
      config: Debug
    archive:
      config: Release
