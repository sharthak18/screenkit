name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "arena/**"
    tags:
      - "v*"

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee /tmp/gradle-build.log

      - name: Post Gradle diagnostics to the temporary issue on failure
        if: failure() && steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Build failed on \`${{ github.ref_name }}\` @ \`${{ github.sha }}\`"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '### Errors'
            echo '```text'
            grep -E '(^| )(e|w): |error:|What went wrong|FAILURE: Build failed|> Task .* FAILED' /tmp/gradle-build.log | head -120 || true
            echo '```'
            echo
            echo '<details><summary>Build log tail</summary>'
            echo
            echo '```text'
            tail -c 30000 /tmp/gradle-build.log
            echo '```'
            echo '</details>'
          } > /tmp/diagnostics.md
          gh issue comment 4 --body-file /tmp/diagnostics.md

      - name: Name APK for download
        run: cp app/build/outputs/apk/debug/app-debug.apk ScreenKit.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenKit.apk
          path: ScreenKit.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.1.0' }}
          name: ScreenKit ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.1.0' }}
          make_latest: true
          generate_release_notes: true
          files: ScreenKit.apk
